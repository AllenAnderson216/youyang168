<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>确认订单 - 周口云鸿商贸有限公司</title><link rel="stylesheet" href="styles.css"><style>
.checkout-wrap{max-width:900px;margin:0 auto;padding:50px 20px}.checkout-card{background:#fff;border:1px solid #eee;border-radius:18px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.05);margin-bottom:20px}.checkout-card h2{margin:0 0 20px}.field{margin-bottom:16px}.field label{display:block;font-weight:600;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #ddd;border-radius:10px;font:inherit}.field textarea{min-height:90px;resize:vertical}.order-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}.order-total{display:flex;justify-content:space-between;font-size:22px;font-weight:700;padding-top:18px}.payment-options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pay-option{border:1px solid #ddd;border-radius:12px;padding:16px;cursor:pointer}.pay-option input{margin-right:8px}.muted{color:#777;font-size:14px}.error{color:#b42318;margin-top:12px}.success{color:#067647}.btn-wide{width:100%;margin-top:10px}
@media(max-width:600px){.payment-options{grid-template-columns:1fr}.checkout-wrap{padding:25px 14px}.checkout-card{padding:20px}}
</style></head><body><header class="header"><div class="header-inner"><a href="index.html" class="logo">云鸿商贸<span>周口云鸿商贸有限公司</span></a><nav class="nav"><a href="index.html">首页</a><a href="products.html">产品中心</a><a href="about.html">关于我们</a><a href="contact.html">联系我们</a></nav></div></header><main><div class="checkout-wrap"><div class="section-title"><div class="section-kicker">CHECKOUT</div><h1>确认订单</h1><p>请填写收货信息并选择支付方式</p></div><div class="checkout-card"><h2>商品清单</h2><div id="items"></div><div class="order-total"><span>订单金额</span><span id="total">¥0.00</span></div></div><form id="checkout-form" class="checkout-card"><h2>收货信息</h2><div class="field"><label>姓名 *</label><input name="name" required maxlength="50"></div><div class="field"><label>手机 *</label><input name="phone" required maxlength="30" inputmode="tel"></div><div class="field"><label>邮箱</label><input name="email" type="email" maxlength="120"></div><div class="field"><label>收货地址 *</label><textarea name="address" required maxlength="300"></textarea></div><div class="field"><label>备注</label><textarea name="note" maxlength="500"></textarea></div><h2>支付方式</h2><div class="payment-options"><label class="pay-option"><input type="radio" name="payment" value="wechat" checked>微信支付</label><label class="pay-option"><input type="radio" name="payment" value="alipay">支付宝</label></div><button class="btn btn-wide" type="submit">提交订单</button><div id="msg" class="muted"></div></form></div></main><script src="checkout.js"></script></body></html>
