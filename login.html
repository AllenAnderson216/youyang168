<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>会员登录 - 周口云鸿商贸有限公司</title><link rel="stylesheet" href="styles.css"><style>.mw{max-width:440px;margin:0 auto;padding:60px 20px}.mc{background:#fff;border:1px solid #eee;border-radius:18px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.05)}.mc h1{margin:0 0 6px;font-size:26px}.f{margin:16px 0}.f label{display:block;margin-bottom:6px;font-size:14px;color:#555}.f input[type=tel],.f input[type=text]{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px}.row{display:flex;gap:10px}.row input{flex:1;min-width:0}.row button{white-space:nowrap;min-width:120px}.agree{font-size:13px;color:#666;display:flex;gap:8px;align-items:flex-start}.agree a{text-decoration:underline}.err{color:#b42318;font-size:14px;min-height:20px;margin-top:10px}.mut{color:#777;font-size:13px}button:disabled{opacity:.5;cursor:not-allowed}</style></head><body><header class="header"><div class="header-inner"><a href="index.html" class="logo">云鸿商贸<span>周口云鸿商贸有限公司</span></a><nav class="nav"><a href="index.html">首页</a><a href="products.html">产品中心</a><a href="about.html">关于我们</a><a href="contact.html">联系我们</a></nav></div></header><main><div class="mw"><div class="mc"><h1>登录 / 注册</h1><p class="mut">未注册的手机号验证后将自动创建会员账号，无需密码。</p><form id="f"><div class="f"><label>手机号</label><input id="phone" type="tel" inputmode="numeric" maxlength="11" autocomplete="tel" placeholder="请输入 11 位手机号"></div><div class="f"><label>验证码</label><div class="row"><input id="code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6 位验证码"><button type="button" id="send" class="btn">获取验证码</button></div></div><label class="agree"><input type="checkbox" id="agree"><span>我已阅读并同意<a href="privacy.html" target="_blank">《隐私政策》</a></span></label><div id="err" class="err"></div><button class="btn btn-wide" id="go" type="submit" style="width:100%">登录</button></form></div></div></main><script>
(function(){
var $=function(i){return document.getElementById(i)};
function nextUrl(){var n=new URLSearchParams(location.search).get('next')||'';
  // 只允许站内相对路径，防止开放重定向
  if(/^[A-Za-z0-9_\-]+\.html(\?[A-Za-z0-9_=&%\-.]*)?$/.test(n)) return n; return 'account.html';}
fetch('/api/me',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){if(d.loggedIn)location.replace(nextUrl())}).catch(function(){});
var timer=null;
function countdown(s){var b=$('send');b.disabled=true;(function t(){if(s<=0){b.disabled=false;b.textContent='获取验证码';return}b.textContent=s+' 秒后重发';s--;timer=setTimeout(t,1000)})()}
async function post(url,data){var r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});var d=await r.json().catch(function(){return{}});if(!r.ok){var e=new Error(d.error||('请求失败（HTTP '+r.status+'）'));e.data=d;throw e}return d}
$('send').onclick=async function(){$('err').textContent='';var p=$('phone').value.trim();
  if(!/^1[3-9]\d{9}$/.test(p)){$('err').textContent='请输入正确的 11 位手机号';return}
  $('send').disabled=true;
  try{await post('/api/auth-send-code',{phone:p});countdown(60);$('code').focus()}
  catch(e){$('err').textContent=e.message;$('send').disabled=false}};
$('f').onsubmit=async function(ev){ev.preventDefault();$('err').textContent='';
  var p=$('phone').value.trim(),c=$('code').value.trim();
  if(!/^1[3-9]\d{9}$/.test(p)){$('err').textContent='请输入正确的 11 位手机号';return}
  if(!/^\d{6}$/.test(c)){$('err').textContent='请输入 6 位验证码';return}
  if(!$('agree').checked){$('err').textContent='请先勾选同意《隐私政策》';return}
  $('go').disabled=true;
  try{await post('/api/auth-login',{phone:p,code:c,agree:true});location.replace(nextUrl())}
  catch(e){$('err').textContent=e.message;$('go').disabled=false}};
})();
</script></body></html>
