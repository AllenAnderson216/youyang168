<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云鸿商贸｜订单后台</title><link rel="stylesheet" href="styles.css"><style>body{background:#f6f7f9}.admin{max-width:1180px;margin:auto;padding:32px 18px}.panel{background:#fff;border:1px solid #e8e8e8;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 8px 28px rgba(0,0,0,.04)}input,select,button{padding:10px 12px;border:1px solid #ddd;border-radius:9px}button{cursor:pointer}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1000px}th,td{padding:12px 9px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.tag{padding:4px 8px;border-radius:20px;background:#f1f3f5}.hidden{display:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center}.modal>div{background:white;padding:24px;border-radius:16px;width:min(460px,90%)}.error{color:#b42318}.ok{color:#067647}</style></head><body><main class="admin"><div id="login" class="panel"><h1>订单管理</h1><p>管理员登录</p><form id="loginForm"><input id="password" type="password" placeholder="后台密码" required><button>登录</button></form><p id="loginMsg" class="error"></p></div><section id="app" class="hidden"><div class="panel"><div class="toolbar"><input id="q" placeholder="订单号 / 姓名 / 手机"><select id="status"><option value="">全部状态</option><option value="pending_payment">待付款</option><option value="paid">已付款</option><option value="shipped">已发货</option><option value="completed">已完成</option><option value="cancelled">已取消</option><option value="refunded">已退款</option></select><button id="refresh">刷新</button></div></div><div class="panel"><div class="table"><table><thead><tr><th>订单</th><th>客户</th><th>金额</th><th>状态</th><th>支付</th><th>物流</th><th>时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main><div id="modal" class="modal hidden"><div><h3>发货</h3><input id="shipCompany" placeholder="快递公司"><input id="shipNo" placeholder="快递单号" style="margin-top:10px"><div class="toolbar" style="margin-top:14px"><button id="shipOk">确认发货</button><button onclick="closeModal()">取消</button></div><p id="modalMsg" class="error"></p></div></div><script>let current='';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const labels={pending_payment:'待付款',paid:'已付款',shipped:'已发货',completed:'已完成',cancelled:'已取消',refunded:'已退款'};async function api(url,opt){const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(r.status===401){$('login').classList.remove('hidden');$('app').classList.add('hidden');throw Error('请重新登录')}if(!r.ok)throw Error(d.error||'请求失败');return d}async function load(){try{const p=new URLSearchParams({q:$('q').value,status:$('status').value});const d=await api('/api/admin-orders?'+p);$('login').classList.add('hidden');$('app').classList.remove('hidden');$('rows').innerHTML=d.orders.map(o=>`<tr><td><b>${esc(o.id)}</b><br>${o.address?esc(o.address):''}</td><td>${esc(o.customer_name)}<br>${esc(o.phone)}</td><td>¥${(o.total_cents/100).toFixed(2)}</td><td><span class="tag">${esc(labels[o.status]||o.status)}</span>${o.refund_status?'<br>退款：'+esc(o.refund_status):''}</td><td>${esc(o.payment_method||'-')}<br>${esc(o.payment_trade_no||'')}</td><td>${esc(o.shipping_company||'')} ${esc(o.shipping_no||'')}</td><td>${esc(o.created_at)}<br>${o.paid_at?'付款：'+esc(o.paid_at):''}</td><td>${o.status==='paid'?`<button onclick="ship('${esc(o.id)}')">发货</button> <button onclick="refund('${esc(o.id)}',${o.total_cents})">退款</button>`:''}${o.status==='shipped'?`<button onclick="complete('${esc(o.id)}')">完成</button>`:''}</td></tr>`).join('')||'<tr><td colspan="8">暂无订单</td></tr>'}catch(e){console.error(e)}}$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMsg').textContent='';try{await api('/api/admin-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('password').value})});$('password').value='';load()}catch(e){$('loginMsg').textContent=e.message}}$('refresh').onclick=load;$('status').onchange=load;function ship(id){current=id;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden');$('modalMsg').textContent=''}$('shipOk').onclick=async()=>{try{await api('/api/admin-order',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({orderId:current,action:'ship',shippingCompany:$('shipCompany').value,shippingNo:$('shipNo').value})});closeModal();load()}catch(e){$('modalMsg').textContent=e.message}}async function complete(id){if(confirm('确认将订单标记为已完成？')){try{await api('/api/admin-order',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({orderId:id,action:'complete'})});load()}catch(e){alert(e.message)}}}async function refund(id,total){const v=prompt('请输入退款金额（元），默认全额：', (total/100).toFixed(2));if(v===null)return;const cents=Math.round(Number(v)*100);if(!Number.isInteger(cents)||cents<1||cents>total){alert('退款金额无效');return}const reason=prompt('退款原因：','客户申请退款')||'客户申请退款';try{await api('/api/refund',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({orderId:id,amountCents:cents,reason})});load()}catch(e){alert(e.message)}}load();</script></body></html>
