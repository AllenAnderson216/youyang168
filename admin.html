<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>云鸿商贸｜订单后台</title>
<style>
:root{
  --brand:#b8845a;--brand-strong:#9c6b43;--brand-soft:#f6e9dc;
  --ink:#1f1b18;--muted:#7a736c;--line:#e8e2db;--bg:#f5f2ee;--card:#fff;
  --danger:#b42318;--danger-soft:#fdecea;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- 顶栏 ---------- */
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1080px;margin:auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:12px}
.brand{font-size:17px;font-weight:800;letter-spacing:.03em}
.brand small{font-size:13px;font-weight:500;color:var(--muted);margin-left:10px;letter-spacing:0}
.topbar .spacer{flex:1}

/* ---------- 按钮 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 16px;border-radius:10px;border:1px solid #d9d2ca;background:#fff;font-weight:600;font-size:13px;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{background:#faf7f3;border-color:#c8bfb5}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#3a332e;border-color:#3a332e}
.btn.brand{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.brand:hover{background:var(--brand-strong);border-color:var(--brand-strong)}
.btn.danger{color:var(--danger);border-color:#efc4bf}
.btn.danger:hover{background:var(--danger-soft);border-color:#e6a9a2}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger.solid:hover{background:#912018;border-color:#912018}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid #d9d2ca;border-top-color:var(--brand);animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- 布局 ---------- */
.wrap{max-width:1080px;margin:auto;padding:22px 20px 60px}

.nav{display:flex;gap:4px;margin-left:18px;background:#f0ebe5;border-radius:10px;padding:3px}
.nav button{height:30px;padding:0 16px;border:0;border-radius:8px;background:none;color:#6b645e;font-weight:600;font-size:13px;cursor:pointer}
.nav button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(31,27,24,.12)}

/* ---------- 会员 ---------- */
.member{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 20px;box-shadow:0 1px 2px rgba(31,27,24,.04)}
.member .phone{font-size:16px;font-weight:700;min-width:130px}
.member .orders{font-size:13px;color:var(--muted)}
.member .times{flex:1 1 240px}
.meta .right{margin-left:auto}
.btn.sm{min-height:30px;padding:0 12px;font-size:12px}

/* ---------- 筛选 ---------- */
.filters{display:flex;flex-direction:column;gap:14px;margin-bottom:18px}
.search{position:relative;max-width:420px}
.search input{width:100%;height:42px;padding:0 14px 0 40px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:14px}
.search input::placeholder{color:#a79f97}
.search input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(184,132,90,.16)}
.search svg{position:absolute;left:13px;top:12px;width:18px;height:18px;stroke:#a79f97;fill:none;stroke-width:2;stroke-linecap:round}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:#5c554f;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.tab:hover{border-color:#cfc6bc}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;min-height:22px;margin-bottom:12px}

/* ---------- 订单卡片 ---------- */
.list{display:flex;flex-direction:column;gap:14px}
.order{--accent:#cfc6bc;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;box-shadow:0 1px 2px rgba(31,27,24,.04)}
.order-head{display:flex;align-items:center;gap:12px;padding:16px 20px 12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--chip-bg);color:var(--chip-fg)}
.chip:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.refund-tag{font-size:12px;color:var(--danger);background:var(--danger-soft);border-radius:6px;padding:2px 8px;white-space:nowrap}
.oid{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1 1 220px}
.oid b{font-size:14px;font-weight:700;word-break:break-all}
.copy{flex:none;border:0;background:none;color:var(--brand-strong);font-size:12px;cursor:pointer;padding:2px 4px;border-radius:4px}
.copy:hover{background:var(--brand-soft)}
.amount{margin-left:auto;font-size:22px;font-weight:800;letter-spacing:-.01em}
.amount small{font-size:13px;font-weight:700;margin-right:1px}

.order-body{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:20px;padding:4px 20px 16px}
.field h4{margin:0 0 4px;font-size:12px;font-weight:600;color:var(--muted)}
.field p{margin:0}
.field .strong{font-weight:700}
.field .sub{color:var(--muted);font-size:13px;word-break:break-all}
.field .empty{color:#a79f97}

.order-foot{display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid #f0ebe5;flex-wrap:wrap}
.times{color:var(--muted);font-size:12.5px;display:flex;gap:16px;flex-wrap:wrap}
.actions{margin-left:auto;display:flex;gap:8px}
.pagination{display:flex;align-items:center;justify-content:center;gap:14px;margin:24px auto 0}
.pagination[hidden]{display:none!important}
.pagination button{min-width:96px}
.pagination span{min-width:180px;text-align:center;color:var(--muted);font-size:13px}

/* ---------- 空 / 骨架 ---------- */
.state{background:#fff;border:1px dashed #d9d2ca;border-radius:14px;padding:56px 20px;text-align:center;color:var(--muted)}
.state strong{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.skeleton{height:150px;border-radius:14px;background:linear-gradient(90deg,#efeae4 25%,#f7f3ef 37%,#efeae4 63%);background-size:400% 100%;animation:sk 1.3s ease infinite}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ---------- 登录 ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{width:min(380px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px 28px;box-shadow:0 18px 50px rgba(28,22,18,.08)}
.login-card h1{margin:0 0 4px;font-size:22px;letter-spacing:.02em}
.login-card p{margin:0 0 22px;color:var(--muted)}
.login-card input{width:100%;height:44px;padding:0 14px;border:1px solid #d9d2ca;border-radius:10px;margin-bottom:12px;font-size:15px}
.login-card input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(184,132,90,.16)}
.login-card .btn{width:100%;min-height:44px;font-size:15px}
.err{color:var(--danger);font-size:13px;min-height:20px;margin:8px 0 0}

/* ---------- 状态配色 ---------- */
.s-pending_payment{--accent:#e0a82e;--chip-bg:#fdf1d3;--chip-fg:#8a5a00}
.s-paid{--accent:var(--brand);--chip-bg:var(--brand-soft);--chip-fg:#8a5a2f}
.s-shipped{--accent:#3b7bd0;--chip-bg:#e2edfb;--chip-fg:#1e4f8f}
.s-completed{--accent:#3aa066;--chip-bg:#dcf3e4;--chip-fg:#1f6b3b}
.s-cancelled{--accent:#c9c2ba;--chip-bg:#eeebe7;--chip-fg:#6b645e}
.s-refunded{--accent:#c25b87;--chip-bg:#f6e2eb;--chip-fg:#8a2c55}

/* ---------- 对话框 ---------- */
dialog{border:0;border-radius:18px;padding:0;width:min(420px,calc(100% - 32px));box-shadow:0 24px 70px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(31,27,24,.5)}
dialog form{padding:24px}
dialog h3{margin:0 0 6px;font-size:18px}
dialog .text{margin:0 0 14px;color:var(--muted)}
dialog label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}
dialog input{width:100%;height:42px;padding:0 12px;border:1px solid #d9d2ca;border-radius:10px;font-size:14px}
dialog input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(184,132,90,.16)}
.dlg-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}

/* ---------- 提示 ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);transition:.25s;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--danger)}

/* ---------- 手机 ---------- */
@media (max-width:760px){
  .wrap{padding:16px 14px 50px}
  .topbar-in{padding:0 14px}
  .brand small{display:none}
  .order-head{padding:14px 16px 8px}
  .amount{font-size:20px}
  .order-body{grid-template-columns:1fr;gap:14px;padding:4px 16px 14px}
  .order-foot{padding:12px 16px}
  .actions{width:100%}
  .actions .btn{flex:1}
  .search{max-width:none}
  .nav{margin-left:8px}
  .member{padding:14px 16px}
  .member .btn{width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- 登录 -->
<div id="login" class="login hidden">
  <form id="loginForm" class="login-card">
    <h1>云鸿商贸</h1>
    <p>订单后台 · 管理员登录</p>
    <input id="password" type="password" placeholder="后台密码" autocomplete="current-password" required>
    <button class="btn primary">登录</button>
    <p id="loginMsg" class="err" role="alert"></p>
  </form>
</div>

<!-- 后台 -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand">云鸿商贸<small>后台</small></div>
      <nav class="nav" id="nav" aria-label="切换页面">
        <button data-view="orders" aria-pressed="true">订单</button>
        <button data-view="members" aria-pressed="false">会员</button>
      </nav>
      <div class="spacer"></div>
      <button id="refresh" class="btn" type="button">刷新</button>
    </div>
  </header>

  <main class="wrap">
    <section class="filters">
      <form id="searchForm" class="search" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="搜索订单号 / 姓名 / 手机" aria-label="搜索">
      </form>
      <div class="tabs" id="tabs" role="group" aria-label="订单状态">
        <button class="tab" data-status="" aria-pressed="true">全部</button>
        <button class="tab" data-status="pending_payment" aria-pressed="false">待付款</button>
        <button class="tab" data-status="paid" aria-pressed="false">待发货</button>
        <button class="tab" data-status="shipped" aria-pressed="false">已发货</button>
        <button class="tab" data-status="completed" aria-pressed="false">已完成</button>
        <button class="tab" data-status="cancelled" aria-pressed="false">已取消</button>
        <button class="tab" data-status="refunded" aria-pressed="false">已退款</button>
      </div>
    </section>

    <div class="meta" id="meta"></div>
    <section class="list" id="rows" aria-live="polite"></section>
    <nav class="pagination" id="listPagination" aria-label="列表分页" hidden><button class="btn" id="prevPage" type="button">上一页</button><span id="pageInfo"></span><button class="btn" id="nextPage" type="button">下一页</button></nav>
  </main>
</div>

<!-- 通用对话框 -->
<dialog id="dlg">
  <form id="dlgForm">
    <h3 id="dlgTitle"></h3>
    <p id="dlgText" class="text"></p>
    <div id="dlgFields"></div>
    <p id="dlgErr" class="err" role="alert"></p>
    <div class="dlg-actions">
      <button type="button" class="btn" id="dlgCancel">取消</button>
      <button class="btn primary" id="dlgOk">确定</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

const STATUS = {
  pending_payment: '待付款', paid: '已付款', shipped: '已发货',
  completed: '已完成', cancelled: '已取消', refunded: '已退款'
};
const PAY = { alipay: '支付宝', wechat: '微信支付' };
const REFUND = { processing: '退款处理中', success: '退款成功', failed: '退款失败' };

let status = '';
let orders = [];
let members = [];
let orderTotal = 0;
let memberTotal = 0;
let orderPage = 1;
let memberPage = 1;
const adminPageSize = 20;
let view = 'orders';
let loadSeq = 0;

/* ---------- 工具 ---------- */
async function api(url, opt) {
  const r = await fetch(url, opt);
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) {
    $('login').classList.remove('hidden');
    $('app').classList.add('hidden');
    throw Error('请重新登录');
  }
  if (!r.ok) throw Error(d.error || '请求失败');
  return d;
}
const post = (url, body) => api(url, {
  method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body)
});

let toastTimer;
function toast(msg, bad) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- 订单列表 ---------- */
function orderCard(o) {
  const label = STATUS[o.status] || o.status;
  const cls = STATUS[o.status] ? o.status : 'cancelled';
  const ship = [o.shipping_company, o.shipping_no].filter(Boolean).join(' ');
  const shipHtml = ship
    ? `<p class="strong">${esc(o.shipping_company || '')}</p><p class="sub">${esc(o.shipping_no || '')}</p>`
    : `<p class="empty">${o.status === 'paid' ? '待发货' : '—'}</p>`;
  const payHtml = o.payment_method || o.payment_trade_no
    ? `<p class="strong">${esc(PAY[o.payment_method] || o.payment_method || '—')}</p><p class="sub">${esc(o.payment_trade_no || '')}</p>`
    : `<p class="empty">${o.status === 'pending_payment' ? '未支付' : '—'}</p>`;

  const acts = [];
  if (o.status === 'paid') {
    acts.push(`<button class="btn danger" data-act="refund">退款</button>`);
    acts.push(`<button class="btn brand" data-act="ship">发货</button>`);
  }
  if (o.status === 'shipped') acts.push(`<button class="btn brand" data-act="complete">标记完成</button>`);
  if (o.status === 'pending_payment' || o.status === 'cancelled') acts.push(`<button class="btn danger" data-act="del">删除</button>`);

  return `<article class="order s-${cls}" data-id="${esc(o.id)}" data-total="${Number(o.total_cents) || 0}">
    <div class="order-head">
      <span class="chip">${esc(label)}</span>
      ${o.refund_status ? `<span class="refund-tag">${esc(REFUND[o.refund_status] || o.refund_status)}</span>` : ''}
      <div class="oid"><b>${esc(o.id)}</b><button class="copy" data-act="copy" title="复制订单号">复制</button></div>
      <div class="amount"><small>¥</small>${((Number(o.total_cents) || 0) / 100).toFixed(2)}</div>
    </div>
    <div class="order-body">
      <div class="field">
        <h4>收件信息</h4>
        <p class="strong">${esc(o.customer_name)}　${esc(o.phone)}</p>
        <p class="sub">${o.address ? esc(o.address) : '<span class="empty">未填写地址</span>'}</p>
      </div>
      <div class="field"><h4>支付</h4>${payHtml}</div>
      <div class="field"><h4>物流</h4>${shipHtml}</div>
    </div>
    <div class="order-foot">
      <div class="times">
        <span>下单 ${esc(o.created_at)}</span>
        ${o.paid_at ? `<span>付款 ${esc(o.paid_at)}</span>` : ''}
      </div>
      ${acts.length ? `<div class="actions">${acts.join('')}</div>` : ''}
    </div>
  </article>`;
}

function render() {
  const box = $('rows');
  $('meta').textContent = orderTotal ? `共 ${orderTotal} 笔订单` : '';
  if (!orders.length) {
    box.innerHTML = `<div class="state"><strong>没有符合条件的订单</strong>换个状态或关键词试试</div>`;
    $('listPagination').hidden = true;
    return;
  }
  box.innerHTML = orders.map(orderCard).join('');
  renderPagination(orderTotal, orderPage);
}

function renderPagination(total, page) {
  const pages = Math.max(1, Math.ceil(total / adminPageSize));
  $('listPagination').hidden = total <= adminPageSize;
  $('pageInfo').textContent = `第 ${page} / ${pages} 页 · 共 ${total} 条`;
  $('prevPage').disabled = page <= 1;
  $('nextPage').disabled = page >= pages;
}

const load = () => (view === 'orders' ? loadOrders() : loadMembers());

async function loadOrders() {
  const seq = ++loadSeq;
  const first = $('app').classList.contains('hidden');
  if (!first) {
    $('meta').innerHTML = '<span class="spin"></span>加载中…';
  }
  try {
    const p = new URLSearchParams({ q: $('q').value.trim(), status, page: String(orderPage) });
    const d = await api('/api/admin-orders?' + p);
    if (seq !== loadSeq) return;           // 忽略过期请求
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
    orders = d.orders || [];
    orderTotal = Number(d.total) || 0;
    orderPage = Number(d.page) || 1;
    render();
  } catch (e) {
    if (e.message !== '请重新登录') {
      $('app').classList.remove('hidden');
      $('meta').textContent = '';
      toast(e.message, true);
    }
  }
}

/* ---------- 会员 ---------- */
function memberCard(m) {
  return `<article class="member" data-id="${Number(m.id)}" data-phone="${esc(m.phone)}">
    <div class="phone">${esc(m.phone)}</div>
    <div class="orders">${m.order_count ? `关联订单 ${m.order_count} 笔` : '暂无订单'}</div>
    <div class="times">
      <span>注册 ${esc(m.created_at)}</span>
      <span>最近登录 ${esc(m.last_login_at || '—')}</span>
    </div>
    <button class="btn danger sm" data-act="mdel">删除会员</button>
  </article>`;
}

function renderMembers() {
  const box = $('rows');
  $('meta').innerHTML = memberTotal
    ? `共 ${memberTotal} 位会员<button class="btn danger sm right" data-act="mclear">清空全部会员</button>`
    : '';
  box.innerHTML = members.length
    ? members.map(memberCard).join('')
    : `<div class="state"><strong>没有会员</strong>还没有人注册，或没有符合搜索的手机号</div>`;
  renderPagination(memberTotal, memberPage);
}

async function loadMembers() {
  const seq = ++loadSeq;
  if (!$('app').classList.contains('hidden')) $('meta').innerHTML = '<span class="spin"></span>加载中…';
  try {
    const d = await api('/api/admin-members?' + new URLSearchParams({ q: $('q').value.trim(), page: String(memberPage) }));
    if (seq !== loadSeq || view !== 'members') return;
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
    members = d.members || [];
    memberTotal = Number(d.total) || 0;
    memberPage = Number(d.page) || 1;
    renderMembers();
  } catch (e) {
    if (e.message !== '请重新登录') { $('meta').textContent = ''; toast(e.message, true); }
  }
}

function delMember(id, phone) {
  openDialog({
    title: '删除会员', text: `将删除会员 ${phone} 的账号。该手机号的订单会保留，对方之后可以重新注册。`,
    okText: '确认删除', danger: true,
    onSubmit: async () => { await post('/api/admin-members', { action: 'delete', userId: id }); toast('会员已删除'); load(); }
  });
}

function clearMembers() {
  openDialog({
    title: '清空全部会员', text: `将删除全部 ${memberTotal} 位会员账号，无法恢复。订单不会被删除。`,
    okText: '确认清空', danger: true,
    fields: [{ id: 'confirm', label: '请输入「清空」二字确认', required: true }],
    onSubmit: async v => {
      if (v.confirm.trim() !== '清空') throw Error('确认文字不正确');
      const d = await post('/api/admin-members', { action: 'clear_all', confirm: 'CLEAR_ALL' });
      toast(`已清空 ${d.deleted || 0} 位会员`); load();
    }
  });
}

function switchView(v) {
  if (v === view) return;
  view = v;
  loadSeq++;
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === v ? 'true' : 'false'));
  $('tabs').classList.toggle('hidden', v !== 'orders');
  $('q').placeholder = v === 'orders' ? '搜索订单号 / 姓名 / 手机' : '搜索会员手机号';
  $('q').value = '';
  $('rows').innerHTML = '';
  $('meta').innerHTML = '<span class="spin"></span>加载中…';
  load();
}
$('nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) switchView(b.dataset.view); });

$('listPagination').addEventListener('click', e => {
  if (e.target.closest('#prevPage')) {
    if (view === 'orders' && orderPage > 1) orderPage--;
    if (view === 'members' && memberPage > 1) memberPage--;
    load();
  } else if (e.target.closest('#nextPage')) {
    if (view === 'orders') orderPage++;
    if (view === 'members') memberPage++;
    load();
  }
});

/* ---------- 对话框 ---------- */
const dlg = $('dlg');
let dlgSubmit = null;

function openDialog({ title, text = '', fields = [], okText = '确定', danger = false, onSubmit }) {
  $('dlgTitle').textContent = title;
  $('dlgText').textContent = text;
  $('dlgText').classList.toggle('hidden', !text);
  $('dlgErr').textContent = '';
  $('dlgFields').innerHTML = fields.map(f =>
    `<label for="f_${f.id}">${esc(f.label)}</label>
     <input id="f_${f.id}" name="${f.id}" value="${esc(f.value || '')}" placeholder="${esc(f.placeholder || '')}"
       ${f.inputmode ? `inputmode="${f.inputmode}"` : ''} ${f.required ? 'required' : ''} autocomplete="off">`).join('');
  const ok = $('dlgOk');
  ok.textContent = okText;
  ok.className = 'btn ' + (danger ? 'danger solid' : 'primary');
  ok.disabled = false;
  dlgSubmit = onSubmit;
  dlg.showModal();
  const first = $('dlgFields').querySelector('input');
  if (first) first.select(); else ok.focus();
}

$('dlgForm').onsubmit = async e => {
  e.preventDefault();
  const vals = Object.fromEntries(new FormData($('dlgForm')).entries());
  const ok = $('dlgOk');
  ok.disabled = true;
  $('dlgErr').textContent = '';
  try {
    await dlgSubmit(vals);
    dlg.close();
  } catch (err) {
    $('dlgErr').textContent = err.message;
    ok.disabled = false;
  }
};
$('dlgCancel').onclick = () => dlg.close();
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

/* ---------- 订单操作 ---------- */
function ship(id) {
  openDialog({
    title: '确认发货', text: `订单 ${id}`, okText: '确认发货',
    fields: [
      { id: 'company', label: '快递公司', placeholder: '例如：顺丰速运', required: true },
      { id: 'no', label: '快递单号', placeholder: '请输入运单号', required: true }
    ],
    onSubmit: async v => {
      await post('/api/admin-order', { orderId: id, action: 'ship', shippingCompany: v.company.trim(), shippingNo: v.no.trim() });
      toast('已发货'); load();
    }
  });
}

function refund(id, total) {
  openDialog({
    title: '申请退款', text: `订单 ${id}　订单金额 ¥${(total / 100).toFixed(2)}`, okText: '确认退款', danger: true,
    fields: [
      { id: 'amount', label: '退款金额（元）', value: (total / 100).toFixed(2), inputmode: 'decimal', required: true },
      { id: 'reason', label: '退款原因', value: '客户申请退款' }
    ],
    onSubmit: async v => {
      const cents = Math.round(Number(v.amount) * 100);
      if (!Number.isInteger(cents) || cents < 1 || cents > total) throw Error('退款金额无效，不能超过订单金额');
      await post('/api/refund', { orderId: id, amountCents: cents, reason: (v.reason || '').trim() || '客户申请退款' });
      toast('退款已提交'); load();
    }
  });
}

function complete(id) {
  openDialog({
    title: '标记为已完成', text: '确认客户已收到货，订单完成？', okText: '确认完成',
    onSubmit: async () => { await post('/api/admin-order', { orderId: id, action: 'complete' }); toast('订单已完成'); load(); }
  });
}

function del(id) {
  openDialog({
    title: '删除订单', text: '删除后无法恢复。仅支持删除待付款或已取消的订单。', okText: '确认删除', danger: true,
    onSubmit: async () => { await post('/api/admin-order', { orderId: id, action: 'delete' }); toast('订单已删除'); load(); }
  });
}

$('meta').addEventListener('click', e => { if (e.target.closest('[data-act="mclear"]')) clearMembers(); });

$('rows').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  if (b.dataset.act === 'mdel') {
    const m = b.closest('.member');
    return delMember(Number(m.dataset.id), m.dataset.phone);
  }
  const card = b.closest('.order');
  const id = card.dataset.id, total = Number(card.dataset.total);
  switch (b.dataset.act) {
    case 'ship': ship(id); break;
    case 'refund': refund(id, total); break;
    case 'complete': complete(id); break;
    case 'del': del(id); break;
    case 'copy':
      (navigator.clipboard ? navigator.clipboard.writeText(id) : Promise.reject())
        .then(() => toast('订单号已复制'), () => toast('复制失败，请手动选择', true));
      break;
  }
});

/* ---------- 筛选 / 登录 ---------- */
$('tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (!t) return;
  status = t.dataset.status;
  orderPage = 1;
  document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-pressed', x === t ? 'true' : 'false'));
  load();
});
$('searchForm').onsubmit = e => { e.preventDefault(); if (view === 'orders') orderPage = 1; else memberPage = 1; load(); };
let qTimer;
$('q').addEventListener('input', () => { if (view === 'orders') orderPage = 1; else memberPage = 1; clearTimeout(qTimer); qTimer = setTimeout(load, 350); });
$('refresh').onclick = load;

$('loginForm').onsubmit = async e => {
  e.preventDefault();
  $('loginMsg').textContent = '';
  try {
    await post('/api/admin-login', { password: $('password').value });
    $('password').value = '';
    load();
  } catch (err) {
    $('loginMsg').textContent = err.message;
  }
};

load();
</script>
</body>
</html>
